name: Publish SDK

# Publishes @quorum/sdk to npm.
#
# Trigger on an `sdk-v*` tag (see docs/publishing.md for the release
# checklist). The tag must match sdk/package.json or the run fails, so a
# version can never be published twice or under the wrong tag.
on:
  push:
    tags: ['sdk-v*']
  workflow_dispatch:

permissions:
  contents: read
  # npm provenance ties the tarball to this workflow run through OIDC.
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish @quorum/sdk
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build ESM and CJS
        run: npm run build
      - name: Test
        run: npm test -- --ci
      - name: Smoke test both import styles
        run: npm run test:smoke
      - name: Verify the release tag matches package.json
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "sdk-v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match sdk/package.json ($version)" >&2
            exit 1
          fi
      - name: Check the version is publishable
        run: npm run check:publish
      # Fails without a valid NPM_TOKEN, and fails with npm's own 403 when the
      # token cannot publish to the @quorum scope.
      - name: Publish
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
